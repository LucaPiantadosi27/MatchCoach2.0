name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  api-lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matchcoach
          POSTGRES_PASSWORD: matchcoach_dev
          POSTGRES_DB: matchcoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run build

      - run: npm test
        env:
          DATABASE_URL: postgresql://matchcoach:matchcoach_dev@localhost:5432/matchcoach_test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
