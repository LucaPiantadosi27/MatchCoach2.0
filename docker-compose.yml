version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: matchcoach-postgres
    environment:
      POSTGRES_USER: matchcoach
      POSTGRES_PASSWORD: matchcoach_dev
      POSTGRES_DB: matchcoach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchcoach"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: matchcoach-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: matchcoach-minio
    environment:
      MINIO_ROOT_USER: matchcoach
      MINIO_ROOT_PASSWORD: matchcoach_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
